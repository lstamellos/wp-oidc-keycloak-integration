name: Bootstrap publish 0.6.31

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap tree
        uses: actions/checkout@v4

      - name: Reconstruct and verify source package
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/chunk.* > /tmp/repo.b64
          base64 --decode /tmp/repo.b64 > /tmp/repo.tar.gz
          echo '52ddc0c4020bc6ab6046af28e459911491bdb9de909d203367a7714dafc16df2  /tmp/repo.tar.gz' | sha256sum -c -
          rm -rf /tmp/repo-source
          mkdir -p /tmp/repo-source
          tar -xzf /tmp/repo.tar.gz -C /tmp/repo-source
          SOURCE=/tmp/repo-source/wp-oidc-keycloak-integration-0.6.31
          test -d "$SOURCE/mu-plugins"
          cp .github/workflows/bootstrap-publish.yml /tmp/bootstrap-publish.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name LICENSE -exec rm -rf {} +
          cp -a "$SOURCE"/. .
          mkdir -p .github/workflows
          rm -f .github/workflows/release.yml
          cp /tmp/bootstrap-publish.yml .github/workflows/bootstrap-publish.yml
          test -f LICENSE
          bash scripts/validate.sh v0.6.31

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish 0.6.31'
          git push origin HEAD:main

      - name: Build release asset
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-release.sh v0.6.31

      - name: Tag verified source
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v0.6.31 -m 'WP OIDC Keycloak Integration 0.6.31'
          git push origin v0.6.31

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.6.31 \
            dist/wp-oidc-keycloak-integration-v0.6.31.zip \
            dist/wp-oidc-keycloak-integration-v0.6.31.zip.sha256 \
            --verify-tag \
            --title 'WP OIDC Keycloak Integration 0.6.31' \
            --generate-notes
