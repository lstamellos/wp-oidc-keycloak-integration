name: Publish 0.6.33 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0.6.33-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out product commit
        uses: actions/checkout@v4
        with:
          ref: 2c8bf74130d3f9e9e7136e3f0332a22c9bc4619a
          fetch-depth: 0

      - name: Validate release
        run: bash scripts/validate.sh v0.6.33

      - name: Build release asset
        run: bash scripts/build-release.sh v0.6.33

      - name: Publish release at product commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.33 >/dev/null 2>&1; then
            echo 'v0.6.33 already published.'
            exit 0
          fi
          ASSET='dist/wp-oidc-keycloak-integration-v0.6.33.zip'
          gh release create v0.6.33 \
            "$ASSET" \
            "$ASSET.sha256" \
            --target 2c8bf74130d3f9e9e7136e3f0332a22c9bc4619a \
            --title 'WP OIDC Keycloak Integration 0.6.33' \
            --generate-notes
